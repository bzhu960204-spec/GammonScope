# Server
server.port=8080

# CORS: overridden by APP_CORS_ALLOWED_ORIGINS in dev when the frontend port shifts
app.cors.allowed-origins=http://localhost:5173

# H2 database (file mode, persists to ./data)
spring.datasource.url=jdbc:h2:file:./data/gammonscope;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# H2 web console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File upload limits for game record imports
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Hot reload (DevTools): restart on recompiled classes, live reload for the browser
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
